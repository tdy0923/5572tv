name: Build & Push Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Gate - skip auto-commit / no-flutter-change
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG="$(git log -1 --pretty=%B)"
            if echo "$MSG" | grep -q "\[skip apk\]"; then
              echo "continue=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: triggered by APK auto-commit"
            elif ! git diff --quiet HEAD~1 HEAD -- flutter_app/; then
              echo "continue=true" >> "$GITHUB_OUTPUT"
              echo "Flutter sources changed"
            else
              echo "continue=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: no Flutter changes in this push"
            fi
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.gate.outputs.continue == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.gate.outputs.continue == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        if: steps.gate.outputs.continue == 'true'
        run: |
          SDK="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK" ] || SDK="$(find "${ANDROID_HOME}" -name sdkmanager -path '*cmdline-tools*' | head -1)"
          echo "Using sdkmanager: $SDK"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          yes | "$SDK" "ndk;29.0.14033849" >/dev/null 2>&1 || true
          ls "${ANDROID_HOME}/ndk" 2>/dev/null || true

      - name: Set up signing keystore
        if: steps.gate.outputs.continue == 'true'
        run: |
          mkdir -p flutter_app/android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > flutter_app/android/release.keystore
          test -s flutter_app/android/release.keystore

      - name: Build release APKs
        if: steps.gate.outputs.continue == 'true'
        working-directory: flutter_app
        run: bash build.sh --android-only
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Copy APKs to download dir
        if: steps.gate.outputs.continue == 'true'
        run: |
          mkdir -p static/download
          cp flutter_app/dist/selene-*-armv8.apk static/download/5572tv-android.apk
          cp flutter_app/dist/selene-*-armv7a.apk static/download/5572tv-android-armv7a.apk
          ls -la static/download/5572tv-android.apk static/download/5572tv-android-armv7a.apk

      - name: Commit and push APKs
        id: commit
        if: steps.gate.outputs.continue == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/download/5572tv-android.apk static/download/5572tv-android-armv7a.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(apk): rebuild Android APKs [skip apk]"
            git push origin HEAD:${{ github.ref_name }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Docker build & deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Build & Push Docker image" --ref "${{ github.ref_name }}"
