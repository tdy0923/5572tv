name: Deploy Deno Segment Proxy

# 分片加速节点（东京/新加坡）：普通CDN分片经此中继，离中国用户近。
# 必须配置 PROXY_TOKEN 鉴权 —— 无鉴权的开放代理会被TVBox白嫖社群
# 扫描滥用，流媒体中继的CPU消耗会迅速耗尽免费额度（已发生过一次）。
# 部署方式说明：本项目使用 Deno Deploy 的 Git 集成自动部署（push 到 main 即构建），
# 无需此工作流。环境变量 PROXY_TOKEN 在 Deno 控制台的项目设置中配置。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deployctl
        run: deno install -Arf jsr:@deno/deployctl

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          PROXY_TOKEN: ${{ secrets.DENO_PROXY_TOKEN }}
        run: |
          deployctl deploy \
            --project=5572tv-segments \
            --entrypoint=deno/segment-proxy.ts \
            --env=PROXY_TOKEN=$PROXY_TOKEN \
            --prod
