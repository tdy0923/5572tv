name: Deploy To Server

on:
  workflow_run:
    workflows: ["Build & Push Docker image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            docker pull ghcr.io/${{ github.repository_owner }}/5572tv:latest

            docker stop 5572tv-core 2>/dev/null || true
            docker rm -f 5572tv-core 2>/dev/null || true
            sleep 2

            # 下载最新 APK 到服务器并挂载
            mkdir -p /app/static/download
            curl -sL -o /app/static/download/5572tv-android.apk \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/static/download/5572tv-android.apk" || true
            echo "APK size: $(wc -c < /app/static/download/5572tv-android.apk 2>/dev/null || echo 0) bytes"

            # 海报本地缓存目录（nextjs 用户 uid=1001），挂载到容器 public/poster-cache 实现跨部署持久化
            mkdir -p /app/poster-cache
            chown -R 1001:1001 /app/poster-cache

            docker run -d \
              --name 5572tv-core \
              --network 5572tv-net \
              -p 3000:3000 \
              -e USERNAME='${{ secrets.USERNAME }}' \
              -e PASSWORD='${{ secrets.SERVER_PASSWORD }}' \
              -e SITE_BASE='https://www.5572.net' \
              -e NEXT_PUBLIC_SITE_NAME='5572影视' \
              -e NEXT_PUBLIC_STORAGE_TYPE='kvrocks' \
              -e STORAGE_TYPE='kvrocks' \
              -e KVROCKS_URL='${{ secrets.KVROCKS_URL }}' \
              -e GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
              -e NVIDIA_API_KEY='${{ secrets.NVIDIA_API_KEY }}' \
              -e AI_API_BASE='${{ secrets.AI_API_BASE }}' \
              -e AI_API_KEY_1='${{ secrets.AI_API_KEY_1 }}' \
              -e AI_API_KEY_2='${{ secrets.AI_API_KEY_2 }}' \
              -e AI_API_KEY_3='${{ secrets.AI_API_KEY_3 }}' \
              -e AI_API_KEY_4='${{ secrets.AI_API_KEY_4 }}' \
              -e AI_API_KEY_5='${{ secrets.AI_API_KEY_5 }}' \
               -e AI_API_KEY_6='${{ secrets.AI_API_KEY_6 }}' \
               -e AUTH_SECRET='${{ secrets.AUTH_SECRET }}' \
               -e OPENSUBTITLES_API_KEY='${{ secrets.OPENSUBTITLES_API_KEY }}' \
               -e OPENSUBTITLES_USERNAME='${{ secrets.OPENSUBTITLES_USERNAME }}' \
               -e OPENSUBTITLES_PASSWORD='${{ secrets.OPENSUBTITLES_PASSWORD }}' \
               -v /app/video-cache:/app/video-cache \
               -v /app/static/download:/app/static/download \
              -v /app/poster-cache:/app/public/poster-cache \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/5572tv:latest

            docker image prune -f

      - name: Purge Cloudflare cache
        run: |
          TOKEN="${{ secrets.CF_API_TOKEN }}"
          EMAIL="${{ secrets.CF_EMAIL }}"
          ZONE=""
          LAST_RESP=""
          for NAME in www.5572.net 5572.net; do
            LAST_RESP=$(curl -s \
              -H "X-Auth-Key: $TOKEN" \
              -H "X-Auth-Email: $EMAIL" \
              "https://api.cloudflare.com/client/v4/zones?name=$NAME")
            ZONE=$(echo "$LAST_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null)
            if [ -n "$ZONE" ]; then
              echo "Found zone $NAME ($ZONE)"
              break
            fi
          done
          if [ -n "$ZONE" ]; then
            for URL in \
              https://www.5572.net/download/5572tv-android.apk \
              https://www.5572.net/static/download/5572tv-android.apk; do
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
                -H "X-Auth-Key: $TOKEN" \
                -H "X-Auth-Email: $EMAIL" \
                -H "Content-Type: application/json" \
                --data "{\"files\":[\"$URL\"]}" || true
            done
            echo "Cloudflare cache purged for APK"
          else
            echo "Warning: Could not find Cloudflare zone; APK may be cached"
            echo "CF API response: $LAST_RESP"
          fi
        shell: bash
        continue-on-error: true
